services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: movie-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - movie-sql-data:/var/opt/mssql
    networks:
      - movie-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-api-container
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MovieRecommendationDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      JWT__Key: "${JWT_KEY}"
      TMDB__AccessToken: "${TMDB_ACCESS_TOKEN}"
      ExternalApi__ApiKey: "${EXTERNAL_API_KEY}"
      Admin__Email: "${ADMIN_EMAIL}"
      Admin__Password: "${ADMIN_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - movie-network

volumes:
  movie-sql-data:
    external: true

networks:
  movie-network:
    external: true